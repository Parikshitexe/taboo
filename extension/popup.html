<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Taboo</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>🔥 Taboo</h1>
            <p>Your tabs have something to say.</p>
        </header>

        <main>

            <div id="roastCard" class="roast-card">

                <span id="roastLabel" class="roast-label">
                    TABOO SAYS
                </span>

                <p id="roastText">
                    Click the button and let me judge your tabs.
                </p>

            </div>

            <button id="roastButton">
                🔥 Roast Me
            </button>

        </main>

        <footer>
            <p>Taboo sees your tabs. Taboo judges your choices.</p>
        </footer>

    </div>

    <script type="module" src="popup.js"></script>

</body>
</html>
